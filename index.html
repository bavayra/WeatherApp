<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A weather app which allows you to get weather info anywhere"
    />
    <meta
      name="keywords"
      content="weather, app, forecast, cloud, sun, rain, city, temperature, humidity"
    />
    <meta name="author" content="x.bavayra" />

    <meta property="og:title" content="Weather app" />
    <meta
      property="og:description"
      content="The weather app that allows to follow the actual weather and forecasts for many cities"
    />
    <meta property="og:url" content="https://bavayra.github.io/WeatherApp" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="images/favicon/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="images/favicon/android-chrome-512x512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/favicon/apple-touch-icon.png"
    />

    <link
      rel="preload"
      href="icons-base/House.svg"
      as="image"
      type="image/svg+xml"
    />

    <link
      rel="preload"
      href="icons-base/bg-sky.webp"
      as="image"
      type="image/webp"
    />

    <script>
      const saved = localStorage.getItem("theme");
      const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        saved ?? (prefersDark ? "dark" : "light"),
      );
    </script>

    <link rel="modulepreload" href="./js/currentWeather.js" />
    <link rel="modulepreload" href="./js/forecast.js" />
    <link rel="modulepreload" href="./js/api.js" />
    <script type="module" src="./js/main.js" defer></script>

    <title>Weather App</title>
  </head>

  <body>
    <main class="container">
      <header id="hero-header">
        <h1 class="hidden" id="hero-header-title">Weather App</h1>
      </header>
      <section id="hero-section" aria-label="Hero">
        <img
          id="hero-bg-image"
          class="daytime-bg"
          src="icons-base/bg-sky.webp"
          alt=""
          width="200"
          height="300"
        />
        <img
          id="house-img-bg"
          src="icons-base/House.svg"
          alt=""
          aria-hidden="true"
          width="200"
          height="300"
          loading="eager"
        />

        <div id="hero-bg-overlay" class="container" aria-hidden="true">
          <div
            id="rectangle1-bg"
            class="rectangle"
            role="presentation"
            aria-hidden="true"
          ></div>
          <div
            id="rectangle2-bg"
            class="rectangle"
            role="presentation"
            aria-hidden="true"
          >
            <div
              id="ellipse2-bg"
              class="ellipse"
              role="presentation"
              aria-hidden="true"
            ></div>
          </div>
          <div
            id="ellipse6-bg"
            class="ellipse"
            role="presentation"
            aria-hidden="true"
          ></div>
          <div
            id="ellipse1-bg"
            class="ellipse"
            role="presentation"
            aria-hidden="true"
          ></div>
          <div
            id="ellipse4-bg"
            class="ellipse"
            role="presentation"
            aria-hidden="true"
          ></div>
        </div>

        <section id="current-weather">
          <div class="current-weather-data">
            <p class="current-city current">Loading...</p>
            <p class="current-temp current">--°</p>
            <div class="current-desc-hum">
              <p class="current-desc current">--</p>
              <p class="current-hum current">Humidity: --%</p>
            </div>
          </div>
        </section>

        <section id="hero-forecasts">
          <section class="home-indicator">
            <div id="shape-toggle" role="presentation" aria-hidden="true"></div>
            <div class="forecasts-btns">
              <button
                id="hourly-forecast-btn"
                type="button"
                aria-pressed="true"
                aria-label="Switch to hourly forecast button"
              >
                Hourly Forecast
              </button>
              <button
                id="daily-forecast-btn"
                type="button"
                aria-pressed="false"
                aria-label="Switch to daily forecast button"
              >
                Daily Forecast
              </button>
            </div>
            <div
              id="forecast-btns-underline"
              role="presentation"
              aria-hidden="true"
            ></div>
            <div
              id="forecast-btns-separator"
              role="presentation"
              aria-hidden="true"
            ></div>
          </section>

          <div class="forecast-by-hours"></div>

          <div class="forecast-by-days visually-hidden"></div>
        </section>
        <div class="app-footer">
          <div id="footer-back">
            <svg
              id="footer-separator"
              viewBox="0 0 390 24"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M0,4 Q195,40 390,4" />
            </svg>
            <div id="back-btns">
              <button
                class="weather-map btn-footer"
                type="button"
                aria-label="Map button"
              >
                <img
                  src="./icons-base/Map.svg"
                  alt="Map button"
                  loading="lazy"
                />
              </button>
              <button
                class="cities-list btn-footer"
                type="button"
                aria-label="Cities list button"
              >
                <img
                  src="./icons-base/List.svg"
                  alt="Cities list"
                  loading="lazy"
                />
              </button>
              <button id="scroll-arrow" aria-label="Scroll to next forecast">
                →
              </button>
            </div>
          </div>

          <div id="footer-center">
            <img
              id="footer-substract"
              role="presentation"
              src="./icons-base/Subtract.svg"
              alt=""
              aria-hidden="true"
              loading="lazy"
              width="80"
              height="80"
            />
            <div id="add-city">
              <div
                id="add-city-bg"
                role="presentation"
                aria-hidden="true"
              ></div>
              <button
                id="add-city-btn"
                type="button"
                aria-label="Add city button"
              >
                <img
                  src="./icons-base/Plus.svg"
                  alt="Add button"
                  loading="lazy"
                  width="32"
                  height="32"
                />
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="weather-by-cities" class="container">
        <div id="ellipse7-bg" class="ellipse"></div>
        <div id="ellipse8-bg" class="ellipse"></div>
        <section id="weather-head">
          <div id="weather-head-container">
            <div id="weather-head-left">
              <button
                id="head-back-btn"
                type="button"
                aria-label="Go back button"
              >
                <img
                  src="./icons-base/arrow-back.svg"
                  alt="Back button"
                  loading="lazy"
                  width="24"
                  height="24"
                />
              </button>
              <p id="head-left-title">Weather</p>
            </div>

            <div id="weather-head-right">
              <button
                id="manage-list-btn"
                type="button"
                aria-label="Manage list button"
              >
                <img
                  src="./icons-base/settings-icon.svg"
                  alt="Manage list button"
                  loading="lazy"
                  width="24"
                  height="24"
                />
              </button>
            </div>
          </div>
        </section>
        <div id="search-bar">
          <div id="search-input-container">
            <button id="search-btn">
              <img
                src="./icons-base/search.svg"
                alt="Search input icon"
                loading="lazy"
                width="20"
                height="20"
              />
            </button>
            <input
              id="search-input"
              placeholder="Search for a city or airport"
              aria-label="Search input bar"
              role="search"
              type="search"
              autocomplete="off"
            />
          </div>
        </div>
        <section id="weather-widget"></section>
      </section>

      <section id="weather-map-search">
        <div id="map-header">
          <button id="map-back-btn" aria-label="Go back">
            <img src="./icons-base/arrow-back.svg" alt="Back button" />
          </button>
          <h2 class="visually-hidden">Weather Map</h2>
        </div>

        <div id="map"></div>

        <div id="map-weather-info" class="hidden"></div>
      </section>
    </main>
  </body>
</html>
